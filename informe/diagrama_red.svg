<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="12" role="img" aria-label="Diagrama de red del laboratorio">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#445"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="692" height="322" rx="10" fill="#fcfdfe" stroke="#8a94a6" stroke-dasharray="6 4"/>
  <text x="18" y="24" font-weight="600" fill="#445">Equipo anfitrión · Oracle VirtualBox</text>

  <!-- Kali -->
  <rect x="24" y="44" width="260" height="150" rx="8" fill="#fff4e5" stroke="#c77b1b" stroke-width="1.5"/>
  <text x="38" y="66" font-weight="700" fill="#7a4a07">Kali Linux 2026.1 · máquina de pruebas</text>
  <text x="38" y="88" fill="#222">IP 192.168.56.102</text>
  <text x="38" y="108" fill="#222">Nmap 7.98 · cliente SSH / SCP</text>
  <text x="38" y="128" fill="#222">Navegador (prueba del sitio web)</text>
  <text x="38" y="148" fill="#222">Rol: evaluador (diagnóstico y validación)</text>
  <text x="38" y="168" fill="#222">Guarda el respaldo externo (scp)</text>

  <!-- Ubuntu -->
  <rect x="416" y="44" width="260" height="150" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="66" font-weight="700" fill="#1b5e20">Ubuntu 26.04.1 LTS · servidor</text>
  <text x="430" y="88" fill="#222">IP 192.168.56.101 (enp0s3)</text>
  <text x="430" y="108" fill="#222">Apache 2.4.66 · 80/tcp · /var/www/html</text>
  <text x="430" y="128" fill="#222">OpenSSH 10.2p1 · 22/tcp (admin: juan)</text>
  <text x="430" y="148" fill="#222">UFW 0.36.2: permite 22 y 80, resto denegado</text>
  <text x="430" y="168" fill="#222">vsftpd 3.0.5 · 21/tcp (deshabilitado)</text>

  <!-- Flujo entre maquinas -->
  <line x1="290" y1="119" x2="410" y2="119" stroke="#445" stroke-width="1.6" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="350" y="104" text-anchor="middle" fill="#445" font-size="11">nmap · ssh</text>
  <text x="350" y="138" text-anchor="middle" fill="#445" font-size="11">scp · http</text>

  <!-- Red -->
  <line x1="154" y1="194" x2="154" y2="246" stroke="#2f6fb5" stroke-width="2"/>
  <line x1="546" y1="194" x2="546" y2="246" stroke="#2f6fb5" stroke-width="2"/>
  <rect x="24" y="246" width="652" height="34" rx="17" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="1.5"/>
  <text x="350" y="268" text-anchor="middle" fill="#1d4f86" font-weight="600">Red aislada «solo-anfitrión» 192.168.56.0/24 · sin salida a Internet</text>

  <text x="350" y="308" text-anchor="middle" fill="#5b6472" font-size="11">Laboratorio con datos ficticios · sin pruebas sobre equipos institucionales, malware real ni denegación de servicio</text>
</svg>
