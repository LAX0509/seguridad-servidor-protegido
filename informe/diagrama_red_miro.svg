<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#C9CED6"/></pattern>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M1,2 L17,9 L1,16 z" fill="#333"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#F7F8FA"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- Titulo -->
  <text x="40" y="60" font-size="34" font-weight="700" fill="#1F2933">Laboratorio: servidor Ubuntu y máquina de pruebas Kali</text>
  <text x="40" y="94" font-size="20" fill="#52606D">Red solo-anfitrión de VirtualBox, aislada y sin salida a Internet</text>

  <!-- Equipo anfitrion -->
  <rect x="40" y="130" width="1520" height="830" rx="26" fill="#FFFFFF" stroke="#8D99A6" stroke-width="3" stroke-dasharray="14 8"/>
  <rect x="70" y="112" width="460" height="42" rx="21" fill="#E4E7EB" stroke="#8D99A6" stroke-width="2"/>
  <text x="300" y="140" font-size="20" font-weight="700" fill="#323F4B" text-anchor="middle">EQUIPO ANFITRIÓN · Windows 11 + VirtualBox</text>

  <!-- KALI -->
  <g filter="url(#sh)">
    <rect x="80" y="260" width="400" height="430" rx="18" fill="#DCEBFB" stroke="#2B6CB0" stroke-width="3"/>
  </g>
  <rect x="80" y="260" width="400" height="64" rx="18" fill="#2B6CB0"/>
  <rect x="80" y="296" width="400" height="28" fill="#2B6CB0"/>
  <text x="280" y="302" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Kali Linux 2026.1</text>
  <text x="280" y="360" font-size="21" fill="#1A365D" text-anchor="middle">Máquina de pruebas</text>
  <rect x="140" y="378" width="280" height="46" rx="10" fill="#fff" stroke="#2B6CB0" stroke-width="2"/>
  <text x="280" y="409" font-size="24" font-weight="700" fill="#1A365D" text-anchor="middle" font-family="Consolas, monospace">192.168.56.102</text>
  <!-- chips Kali -->
  <rect x="120" y="450" width="320" height="52" rx="12" fill="#FFF3B0" stroke="#B7950B" stroke-width="2"/>
  <text x="280" y="484" font-size="22" fill="#3D3300" text-anchor="middle">Nmap 7.98 (escaneo)</text>
  <rect x="120" y="516" width="320" height="52" rx="12" fill="#FFF3B0" stroke="#B7950B" stroke-width="2"/>
  <text x="280" y="550" font-size="22" fill="#3D3300" text-anchor="middle">Cliente SSH / SCP</text>
  <rect x="120" y="582" width="320" height="52" rx="12" fill="#FFF3B0" stroke="#B7950B" stroke-width="2"/>
  <text x="280" y="616" font-size="22" fill="#3D3300" text-anchor="middle">curl + navegador</text>
  <text x="280" y="668" font-size="19" fill="#1A365D" text-anchor="middle">Guarda la copia del respaldo</text>

  <!-- Switch / red -->
  <g filter="url(#sh)">
    <rect x="640" y="400" width="320" height="150" rx="75" fill="#FFE8CC" stroke="#DD6B20" stroke-width="3"/>
  </g>
  <text x="800" y="458" font-size="24" font-weight="700" fill="#7B341E" text-anchor="middle">Red solo-anfitrión</text>
  <text x="800" y="492" font-size="23" fill="#7B341E" text-anchor="middle" font-family="Consolas, monospace">192.168.56.0/24</text>
  <text x="800" y="524" font-size="19" fill="#7B341E" text-anchor="middle">aislada</text>

  <!-- Conexiones -->
  <line x1="480" y1="440" x2="640" y2="450" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="640" y1="515" x2="480" y2="530" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="960" y1="450" x2="1120" y2="440" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1120" y1="515" x2="960" y2="500" stroke="#333" stroke-width="4" marker-end="url(#arr)"/>
  <rect x="505" y="338" width="108" height="34" rx="17" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="559" y="361" font-size="19" font-weight="700" text-anchor="middle" fill="#222">Nmap</text>
  <rect x="500" y="568" width="120" height="34" rx="17" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="560" y="591" font-size="19" font-weight="700" text-anchor="middle" fill="#222">SSH :22</text>
  <rect x="980" y="338" width="130" height="34" rx="17" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="1045" y="361" font-size="19" font-weight="700" text-anchor="middle" fill="#222">HTTP :80</text>
  <rect x="970" y="568" width="140" height="34" rx="17" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="1040" y="591" font-size="19" font-weight="700" text-anchor="middle" fill="#222">SCP (copia)</text>

  <!-- Sin Internet -->
  <g>
    <ellipse cx="800" cy="215" rx="150" ry="62" fill="#F1F3F5" stroke="#9AA5B1" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="800" y="224" font-size="28" fill="#7B8794" text-anchor="middle">Internet</text>
    <circle cx="960" cy="175" r="30" fill="#fff" stroke="#E53E3E" stroke-width="7"/>
    <line x1="939" y1="196" x2="981" y2="154" stroke="#E53E3E" stroke-width="7"/>
    <text x="800" y="310" font-size="20" font-weight="700" fill="#C53030" text-anchor="middle">Sin salida a Internet</text>
    <line x1="800" y1="326" x2="800" y2="396" stroke="#E53E3E" stroke-width="3" stroke-dasharray="6 6"/>
  </g>

  <!-- UBUNTU -->
  <g filter="url(#sh)">
    <rect x="1120" y="200" width="400" height="720" rx="18" fill="#E6F6EC" stroke="#2F855A" stroke-width="3"/>
  </g>
  <rect x="1120" y="200" width="400" height="64" rx="18" fill="#2F855A"/>
  <rect x="1120" y="236" width="400" height="28" fill="#2F855A"/>
  <text x="1320" y="242" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Ubuntu 26.04.1 LTS</text>
  <text x="1320" y="298" font-size="21" fill="#1C4532" text-anchor="middle">Servidor de la organización</text>
  <rect x="1180" y="316" width="280" height="46" rx="10" fill="#fff" stroke="#2F855A" stroke-width="2"/>
  <text x="1320" y="347" font-size="24" font-weight="700" fill="#1C4532" text-anchor="middle" font-family="Consolas, monospace">192.168.56.101</text>

  <!-- UFW -->
  <rect x="1150" y="384" width="340" height="70" rx="12" fill="#FED7D7" stroke="#C53030" stroke-width="3"/>
  <text x="1320" y="414" font-size="22" font-weight="700" fill="#742A2A" text-anchor="middle">Firewall UFW</text>
  <text x="1320" y="440" font-size="18" fill="#742A2A" text-anchor="middle">entrante denegado · permite 22 y 80</text>

  <rect x="1150" y="476" width="340" height="62" rx="12" fill="#C6F6D5" stroke="#2F855A" stroke-width="2"/>
  <text x="1320" y="504" font-size="22" font-weight="700" fill="#1C4532" text-anchor="middle">Apache 2.4.66 · puerto 80</text>
  <text x="1320" y="526" font-size="17" fill="#1C4532" text-anchor="middle">Sitio web de la organización</text>

  <rect x="1150" y="552" width="340" height="62" rx="12" fill="#C6F6D5" stroke="#2F855A" stroke-width="2"/>
  <text x="1320" y="580" font-size="22" font-weight="700" fill="#1C4532" text-anchor="middle">OpenSSH 10.2p1 · puerto 22</text>
  <text x="1320" y="602" font-size="17" fill="#1C4532" text-anchor="middle">Administración remota (juan)</text>

  <rect x="1150" y="628" width="340" height="62" rx="12" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1320" y="656" font-size="22" font-weight="700" fill="#718096" text-anchor="middle" text-decoration="line-through">vsftpd 3.0.5 · puerto 21</text>
  <text x="1320" y="678" font-size="17" fill="#718096" text-anchor="middle">Detenido y deshabilitado</text>

  <rect x="1150" y="708" width="340" height="62" rx="12" fill="#FFF3B0" stroke="#B7950B" stroke-width="2"/>
  <text x="1320" y="736" font-size="22" font-weight="700" fill="#3D3300" text-anchor="middle">Registros y respaldo</text>
  <text x="1320" y="758" font-size="17" fill="#3D3300" text-anchor="middle">/var/log/auth.log · respaldo_servidor.tar.gz</text>

  <rect x="1150" y="788" width="340" height="104" rx="12" fill="#fff" stroke="#2F855A" stroke-width="2"/>
  <text x="1170" y="818" font-size="19" font-weight="700" fill="#1C4532">Cuentas</text>
  <text x="1170" y="846" font-size="18" fill="#1C4532">juan: administrador (sudo)</text>
  <text x="1170" y="872" font-size="18" fill="#1C4532">root: sin login por SSH</text>

  <!-- Respaldo flecha -->
  <path d="M 1120 850 C 900 975, 300 975, 280 694" fill="none" stroke="#B7950B" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arr)"/>
  <rect x="640" y="926" width="320" height="34" rx="17" fill="#FFF3B0" stroke="#B7950B" stroke-width="2"/>
  <text x="800" y="949" font-size="19" font-weight="700" fill="#3D3300" text-anchor="middle">Copia del respaldo fuera de la VM</text>

  <!-- leyenda -->
  <rect x="580" y="640" width="400" height="130" rx="14" fill="#fff" stroke="#CBD2D9" stroke-width="2"/>
  <text x="600" y="672" font-size="19" font-weight="700" fill="#323F4B">Leyenda</text>
  <rect x="600" y="686" width="26" height="20" rx="4" fill="#C6F6D5" stroke="#2F855A" stroke-width="2"/>
  <text x="640" y="703" font-size="17" fill="#323F4B">Servicio necesario, activo</text>
  <rect x="600" y="716" width="26" height="20" rx="4" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="640" y="733" font-size="17" fill="#323F4B">Servicio innecesario, desactivado</text>
  <rect x="600" y="746" width="26" height="20" rx="4" fill="#FED7D7" stroke="#C53030" stroke-width="2"/>
  <text x="640" y="763" font-size="17" fill="#323F4B">Control de seguridad</text>
</svg>
